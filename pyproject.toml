[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "terminal-home"
dynamic = ["version"]
description = "A declarative tmux workspace manager for terminal-based development"
readme = "README.md"
license = {file = "LICENSE"}
requires-python = ">=3.10"
dependencies = [
    "textual>=0.60",
]
authors = [{name = "Terminal Home contributors"}]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Operating System :: POSIX :: Linux",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Software Development :: User Interfaces",
]
keywords = ["tmux", "terminal", "workspace", "ssh"]

[project.urls]
Homepage = "https://github.com/PabloAlmanza47/Terminal-Home"
Repository = "https://github.com/PabloAlmanza47/Terminal-Home"
Issues = "https://github.com/PabloAlmanza47/Terminal-Home/issues"

[project.optional-dependencies]
dev = [
    "build>=1.2",
    "pytest>=8",
    "mypy>=1.10",
    "ruff>=0.5",
    "tomli>=2; python_version < '3.11'",
]

[project.scripts]
terminal-home = "dashboard.cli:main"
th = "dashboard.cli:main"
dev = "dashboard.cli:main"

[tool.setuptools.packages.find]
include = ["dashboard*"]

[tool.setuptools.dynamic]
version = {attr = "dashboard.__version__"}

[tool.setuptools.package-data]
dashboard = ["*.tcss"]

[tool.mypy]
python_version = "3.10"
ignore_missing_imports = true

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]
